name: Deploy UmaPCT to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Disk usage before install
        run: |
          echo "=== BEFORE NPM CI ==="
          df -h
          echo ""
          echo "=== WORKSPACE SIZE ==="
          du -sh . || true

      - name: Install dependencies
        run: npm ci

      - name: Disk usage after install
        run: |
          echo "=== AFTER NPM CI ==="
          df -h
          echo ""
          echo "=== NODE_MODULES ==="
          du -sh node_modules || true
          echo ""
          echo "=== WORKSPACE SIZE ==="
          du -sh . || true

      - name: Build
        run: npm run build

      - name: Disk usage after build
        run: |
          echo "=== AFTER BUILD ==="
          df -h
          echo ""
          echo "=== NODE_MODULES ==="
          du -sh node_modules || true
          echo ""
          echo "=== DIST ==="
          du -sh dist || true
          echo ""
          echo "=== WORKSPACE SIZE ==="
          du -sh . || true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5